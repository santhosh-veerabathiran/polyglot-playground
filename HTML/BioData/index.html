<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bio Data</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="biodata">
        <div class="heading">
            <h1>Bio Data</h1>
        </div>
        <form action="">
            <div class="bio-input">
                <label>Name:</label>
                <input type="text" name="name" placeholder="Enter your name">
            </div>
            <div class="bio-input">
                <label>Phone No.:</label>
                <input type="text" name="phno" placeholder="Enter your phone number">
            </div>
            <div class="bio-input">
                <label>DOB:</label>
                <input type="date" name="dob" placeholder="Enter your date of birth">
            </div>
            <div class="bio-input">
                <label>Gender:</label>
                <input type="radio" name="gender" value="Male" title="Male" checked>Male
                <input type="radio" name="gender" value="Female" title="Female">Female
            </div>
            <div class="bio-input">
                <label>Languages:</label>
                <input type="checkbox" name="lang1" value="Tamil" title="Tamil">Tamil
                <input type="checkbox" name="lang2" value="English" title="English">English
                <input type="checkbox" name="lang3" value="Telugu" title="Telugu">Telugu
            </div>
            <div class="bio-input">
                <label>Address:</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>
            <div class="bio-btn">
                <button type="submit" title="Submit">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
