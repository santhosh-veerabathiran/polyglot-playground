<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Auto Complete Search bar</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" media="screen" href="search.css" />
    </head>

    <body>
        <div class="content">
            <h1>Autocomplete</h1>
            <p>This is autocomplete search bar example</p>
        </div>
        <div class="search-box">
            <div class="search-input">
                <input type="text" id="input-box" onkeyup="results()" placeholder="Search Anything" autocomplete="off" />
                <button type="button" title="Search"><span class="fa fa-search"></span></button>
            </div>
            <div class="result-box"></div>
        </div>

        <script>
            let keys = [
                'Ashok',
                'Bharath',
                'Dinesh',
                'Kamesh',
                'Kishore',
                'Naveen Raj',
                'Jidhush',
                'Ranjith',
                'Santhosh',
                'Saravanan',
                'Sharan',
                'Venkitaramanan',
                'Ganesh Kumar',
            ];

            const resultBox = document.querySelector('.result-box');
            const inputBox = document.getElementById('input-box');

            inputBox.onkeyup = function () {
                let result = [];
                let input = inputBox.value;
                if (input.length) {
                    result = keys.filter((keyword) => {
                        return keyword.toLowerCase().includes(input.toLowerCase());
                    });
                    console.log(result);
                    display(result);
                } else {
                    resultBox.innerHTML = '';
                }
            };

            function display(result) {
                if (result.length) {
                    const content = result.map((list) => {
                        return '<li onclick=selectInput(this)>' + list + '</li>';
                    });
                    resultBox.innerHTML = '<ul>' + content.join('') + '</ul>';
                } else {
                    resultBox.innerHTML = '<ul><li>No Result Found</li></ul>';
                }
            }

            function selectInput(list) {
                inputBox.value = list.innerHTML;
                resultBox.innerHTML = '';
            }
        </script>
    </body>
</html>
