<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Form Submission Example</title>
    <style>
        * {
            font-family: Bookman Old Style;
            font-style: italic;
        }

        h1 {
            text-align: center;
        }

        form {
            width: 50%;
            margin: 0px auto;
            padding: 20px 30px;
            border: 1px solid silver;
            border-radius: 5px;
            font-size: 18px;
        }

        input {
            width: 100%;
            font-size: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0px;
        }
    </style>
</head>

<body>
    <h1>Python Form Submission</h1>

    <form class="grid" action="/result" method="POST">
        <label for="Name">Enter your name: </label>
        <input type="text" name="name" id="name" placeholder="Name">
        <input type="submit" value="Submit">
    </form>

    {% if msg,name %}
    <h1>{{msg}}{{name}}</h1>
    {% endif %}
</body>

</html>
