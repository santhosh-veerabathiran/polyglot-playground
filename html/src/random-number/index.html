<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Random Number Generator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Random Number Generator</h1>
        <div class="container">

            <script src="app.js"></script>
        </div>
    </body>
