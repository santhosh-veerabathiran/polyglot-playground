<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Multi Step Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    </head>

    <body>
        <div class="container">
            <header>Signup Form</header>
            <div class="progress-bar">
                <div class="step">
                    <p>Name</p>
                    <div class="bullet">
                        <span>1</span>
                    </div>
                    <div class="check fas fa-check"></div>
                </div>
                <div class="step">
                    <p>Conact</p>
                    <div class="bullet">
                        <span>2</span>
                    </div>
                    <div class="check fas fa-check"></div>
                </div>
                <div class="step">
                    <p>Birth</p>
                    <div class="bullet">
                        <span>3</span>
                    </div>
                    <div class="check fas fa-check"></div>
                </div>
                <div class="step">
                    <p>Submit</p>
                    <div class="bullet">
                        <span>4</span>
                    </div>
                    <div class="check fas fa-check"></div>
                </div>
            </div>
            <div class="form-outer">
                <form action="#">
                    <div class="page slidepage">
                        <div class="title">Basic Info:</div>
                        <div class="field">
                            <div class="label">First Name</div>
                            <input type="text" name="fname" placeholder="Enter your First Name" />
                        </div>
                        <div class="field">
                            <div class="label">Last Name</div>
                            <input type="text" name="lname" placeholder="Enter your Last Name" />
                        </div>
                        <div class="field">
                            <button type="button" class="next-1">Next</button>
                        </div>
                    </div>

                    <div class="page">
                        <div class="title">Contact Info:</div>
                        <div class="field">
                            <div class="label">Email Address</div>
                            <input type="text" name="email" placeholder="Enter your email" />
                        </div>
                        <div class="field">
                            <div class="label">Phone Number</div>
                            <input type="number" name="phone" placeholder="Enter your phone no" />
                        </div>
                        <div class="field btns">
                            <button type="button" class="prev-1 prev">Previous</button>
                            <button type="button" class="next-2 next">Next</button>
                        </div>
                    </div>

                    <div class="page">
                        <div class="title">Date of Birth:</div>
                        <div class="field">
                            <div class="label">Date</div>
                            <input type="text" name="dob" placeholder="Enter your Date of Birth" />
                        </div>
                        <div class="field">
                            <div class="label">Gender</div>
                            <select name="gender" title="Select Gender">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="field btns">
                            <button type="button" class="prev-2 prev">Previous</button>
                            <button type="button" class="next-3 next">Next</button>
                        </div>
                    </div>

                    <div class="page">
                        <div class="title">Login Details:</div>
                        <div class="field">
                            <div class="label">Username</div>
                            <input type="text" name="uname" placeholder="Enter your User Name" />
                        </div>
                        <div class="field">
                            <div class="label">Password</div>
                            <input type="password" name="psw" placeholder="Enter your Password" />
                        </div>
                        <div class="field btns">
                            <button type="button" class="prev-3 prev">Previous</button>
                            <button type="submit" class="submit next">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript" src="app.js"></script>
    </body>
</html>
